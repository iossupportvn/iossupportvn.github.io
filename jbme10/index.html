<!DOCTYPE html>
<html lang="en" manifest="manifest.appcache">
<title>&#8290;</title>
<meta charset="utf-8">
<!-- UI Properties -->
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<link rel="stylesheet" type="text/css" href="css/all.css">
<!-- iOS App Properties -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">

<script>
window.onerror = function(ev)
{
    alert('Uncaught error: ' + ev);
};
</script>
<script src="js/all.js"></script>
<script src="js/pwn.js"></script>
<script>
  function updateVNTime() {
    var clockElement = document.getElementById("clock");
    if (!clockElement) return;

    // Lấy thời gian hiện tại theo múi giờ Việt Nam (Asia/Ho_Chi_Minh)
    var now = new Date();
    var vnTimeString = now.toLocaleTimeString("en-US", {
      timeZone: "Asia/Ho_Chi_Minh",
      hour12: false,
      hour: "2-digit",
      minute: "2-digit"
    });

    clockElement.textContent = vnTimeString;
  }

  // Cập nhật ngay khi tải trang
  updateVNTime();

  // Cập nhật lại mỗi 1 giây (1000ms)
  setInterval(updateVNTime, 1000);
</script>
<style>
#alertboxbody{
    margin:10px;color:#FFF;
    max-width:320px;
    background-image:-webkit-linear-gradient(top, #8c9cbf 0%, #546a9e 30%, #153153 30%, #091636 100%);
    border:2px solid #ededee;
    border-radius:10px;
    padding:5px;
    margin:2rem 0.5rem;
    text-align:-webkit-center;
    font:bold 17px/1.5 helvetica;
}
</style>
<body class="crazycolors">

    <div id="main">

        <div id="notice"></div>
    </div>
    <div id="slider">

            </div>
        </div>
    </div>
</body>
